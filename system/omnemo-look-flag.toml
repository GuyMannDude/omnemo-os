# omnemo-os:begin (managed; removed by omnemo-os uninstall)
# Omnemo OS look, variant FLAG: a clear bar over guy.flag (blue fields, red and white stripes).
# Later keys win, so this block overrides the theme (and any [bar] above).
[bar]
background       = "#0B0E14"
background-alpha = 0.0   # clear: guy.flag paints under the bar
text             = "#FFFFFF"

[popups]
background       = "#0B0E14"
background-alpha = 1.0

# Read by the Omnemo OS plugins (guy.*): the active-window marker and the
# menu cards' 1px hairline.
[omnemo]
accent           = "#0B6BDD"
hairline         = "#0B6BDD"
hairline-alpha   = 0.35
# The flag bar (guy.flag). Blue matches the "?" icon (Papirus help-browser
# #435ECE), Guy 11-07; the plugin default stays Old Glory #3C3B6E.
[flag]
blue             = "#435ECE"
# The stripes ripple like cloth on mains power and hold still on battery.
# To change that, take the "#" off ONE line:
# motion         = "calm"   # slower and gentler, on mains and on battery
# motion         = "off"    # a still flag
# motion         = "full"   # the full ripple even on battery
# stars          = 0        # no stars at the ends of the blue fields
# depth          = 0        # the flat flag of 0.9.2: no shine, no motion
# omnemo-os:end
